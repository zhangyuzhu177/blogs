services:
  blogs_node:
    build:
      context: .
      dockerfile: Dockerfile
    image: zyz_node
    container_name: blogs_node
    restart: always
    init: true
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      SERVER_PORT: 3000
    env_file:
      - ./projects/server/.env
    ports:
      - "3000:3000"
    networks:
      blogs_net:
        ipv4_address: 10.10.99.10
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('node:net').connect(3000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

networks:
  blogs_net:
    external: true
